; FasterEdge MCU — PY32F002A PlatformIO project
; Official Puya CMSIS/LL-based community platform, Cortex-M0+ / 20KB / 3KB.
[env:py32f002ax5]
platform = https://github.com/Community-PIO-PY32F0/platform-puya32f0.git
board = genericPY32F002Ax5
framework = puya-py32f0-ll-sdk
monitor_speed = 115200
upload_protocol = cmsis-dap
build_flags =
    -DFOSC=24000000UL
    -DPY32F002Ax5
    -Os
    -ffunction-sections
    -fdata-sections
